<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pharos_network生态导航</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- 顶部 big tag -->
    <div id="top-tags" class="container">
        <div class="big-tag" id="insert-button-okx" >小狐狸钱包</div>
        <div class="big-tag" id="random-nft-button">随机NFT</div>
    </div>

    <!-- 所有其他分组容器 -->
    <div class="container" id="group-tags-container"></div>

    <script>
    (() => {

        const tagGroups = [
            {
                title: "NFT",
                tags: [
                    { "name": "1-Pharos", "url": "https://app.grandline.world/launchpad/mint/0x1da9f40036bee3fda37ddd9bff624e1125d8991d" },
                    { "name": "2-FaroSwap", "url": "https://app.grandline.world/launchpad/mint/0x2a469a4073480596b9deb19f52aa89891ccff5ce" },
                    { "name": "3-Zentra", "url": "https://app.grandline.world/launchpad/mint/0xe71188df7be6321ffd5aaa6e52e6c96375e62793" },
                    { "name": "4-Gotchipus", "url": "https://app.grandline.world/launchpad/mint/0xb2ac4f09735007562c513ebbe152a8d7fa682bef" },
                    { "name": "5-Spout", "url": "https://app.grandline.world/launchpad/mint/0x96381ed3fcfb385cbacfe6908159f0905b19767a" },
                    { "name": "6-AutoStaking", "url": "https://app.grandline.world/launchpad/mint/0x0d00314d006e70ca08ac37c3469b4bf958a7580b" },
                    { "name": "7-PNS", "url": "https://app.grandline.world/launchpad/mint/0x4af366c7269dc9a0335bd055af979729c20e0f5f" },
                    { "name": "8-Brokex", "url": "https://app.grandline.world/launchpad/mint/0x9979b7fedf761c2989642f63ba6ed580dbdfc46f" },
                    { "name": "9-OpenFi", "url": "https://app.grandline.world/launchpad/mint/0x822483f6cf39b7dad66fec5f4feecbfd72172626" },
                    { "name": "10-MoveFlow", "url": "https://app.grandline.world/launchpad/mint/0xc188e0ad7e39ccd3bdfdc5572e06e5ac08f1a847" },
                    { "name": "11-Zenith", "url": "https://app.grandline.world/launchpad/mint/0xf4535d0781d973a26b48c617410419ec66b2af1c" }
                ]
            }
        ];

        function getRandomNFTUrl() {
            const nftGroup = tagGroups.find(group => group.title === "NFT");
            if (!nftGroup || nftGroup.tags.length === 0) return null;
            const randomTag = nftGroup.tags[Math.floor(Math.random() * nftGroup.tags.length)];
            return randomTag.url;
        }

        document.getElementById("random-nft-button").addEventListener("click", () => {
            const url = getRandomNFTUrl();
            if (url) {
                window.open(url, '_blank');
            } else {
                alert("没有可用的NFT链接");
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderGroups(tagGroups);
        });

        function createTagElement(tag) {
            const el = document.createElement('div');
            el.className = 'tag';
            el.textContent = tag.name;
            el.dataset.url = tag.url;
            el.addEventListener('click', () => {
                window.open(tag.url, '_blank');
            });
            return el;
        }

        function renderGroups(groups) {
            const container = document.getElementById('group-tags-container');
            container.innerHTML = '';

            groups.forEach(group => {
                const card = document.createElement('div');
                card.className = 'group-card';

                const title = document.createElement('div');
                title.className = 'category-title';
                title.textContent = group.title || '';
                card.appendChild(title);

                const tagGroup = document.createElement('div');
                tagGroup.className = 'tag-group';

                group.tags.forEach(tag => {
                    tagGroup.appendChild(createTagElement(tag));
                });

                card.appendChild(tagGroup);
                container.appendChild(card);
            });
        }

    })();
    </script>
</body>
</html>
